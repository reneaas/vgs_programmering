title: Programmering i Videregående Skole
author: René Ask
copyright: "2024"
exclude_patterns: [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints", README.md]


# launch_buttons:
#   notebook_interface: "jupyterlab"  # or "classic"
#   binderhub_url: "https://mybinder.org"
#   thebe: true
#   colab_url: "https://colab.research.google.com"

options:
  numbered: true

execute:
  execute_notebooks: auto

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - html_image
    - deflist
    - tasklist
    - attrs_inline
    - attrs_block
    - smartquotes
    - colon_fence


repository:
  url: https://github.com/reneaas/vgs_programmering
  path_to_book: book
  branch: main


pdfhtml:
  extra_css:
    - _static/
  

extra_static_paths:
  - _static

html:
  use_issues_button: false
  use_repository_button: true
  nb_number_source_lines: false
  extra_js:
    - _static
    - https://cdnjs.cloudflare.com/ajax/libs/mermaid/8.13.4/mermaid.min.js
  extra_css:
    - _static/


sphinx:
  extra_extensions:
    - sphinx_proof
    - sphinx_inline_tabs
    - sphinxmermaid
    - sphinxcontrib.tikz
    - sphinx_jupyterbook_latex
    - sphinxcontrib.video
    - munchboka_edutools


  config:
    language: norwegian
    html_baseurl: "https://prog.munchboka.no"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3.2/es5/tex-mml-chtml.js
    html_theme_options:
      pygments_light_style: "github-light"
      pygments_dark_style: "github-dark-high-contrast"
    templates_path:
      - "_templates"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3.2/es5/tex-mml-chtml.js
    mathjax3_config:
      loader:
        load: ['[tex]/physics']
      tex:
        packages: {'[+]': ['physics']}
        macros:
          annotateAbove: ["\\mathrel{\\overset{\\substack{\\text{#2} \\\\ \\Bigg\\downarrow}}{#1}}", 2]
          annotateBelow: ["\\mathrel{\\underset{\\substack{\\Bigg\\uparrow \\\\ \\text{#2}}}{#1}}", 2]
          cline: ["\\underline{\\phantom{#1}}", 1]
          and: ["\\quad \\land \\quad"]
          or: ["\\quad \\lor \\quad"]
          liff: ["\\quad \\iff \\quad"]
          limplies: ["\\quad \\implies \\quad"]
          limpliedby: ["\\quad \\impliedby \\quad"]
          lland: ["\\; \\land \\;"]
          degree: ["^\\circ"]
          qog: ["\\quad \\text{og} \\quad"]
          qder: ["\\quad \\text{der} \\quad"]
          qeller: ["\\quad \\text{eller} \\quad"]
          qhvis: ["\\quad \\text{hvis} \\quad"]
          qfor: ["\\quad \\text{for} \\quad"]
          natural: ["\\mathbb{N}"]
          integer: ["\\mathbb{Z}"]
          rational: ["\\mathbb{Q}"]
          real: ["\\mathbb{R}"]
          irrational: ["\\mathbb{Q}^c"]
          qcomma: [",\\quad"]
          nimplies: ["\\quad\\mathrel{\\not\\!\\!\\!\\implies}\\quad"]
          nimpliedby: ["\\quad\\mathrel{\\not\\!\\!\\!\\impliedby}\\quad"]
          niff: ["\\quad\\mathrel{\\not\\!\\!\\!\\iff}\\quad"]
          cubica: ["\\raisebox{-0.4ex}{\\small\\(\\frown\\!\\smile\\)}", 0]
          cubicb: ["\\raisebox{-0.4ex}{\\small\\(\\smile\\!\\frown\\)}", 0]
          t: ["\\mathrm{#1}", 1]
          dot: ["\\vec{#1} \\cdot \\vec{#2}", 2]
          len: ["\\abs{\\vec{#1}}", 1]
          lvec: ["\\overrightarrow{#1}", 1]
          v: ["\\left[#1, #2\\right]", 2]
          proj: ["\\mathrm{proj}_{#1}\\left(#2\\right)", 2]
          mstack: ["\\begin{array}{c}#1\\end{array}", 1]
          d: ["\\, \\mathrm{d}"]
          dx: ["\\, \\mathrm{d} x"]
          du: ["\\, \\mathrm{d} u"]
          dz: ["\\, \\mathrm{d} z"]
          dt: ["\\, \\mathrm{d} t"]
          dy: ["\\, \\mathrm{d} y"]
          ds: ["\\, \\mathrm{d} s"]
          eq: ["\\, (\\mathrm{#1})", 1]



    html_theme_options:
      pygments_light_style: "github-light"
      pygments_dark_style: "github-dark-high-contrast"
    templates_path:
      - "_templates"
